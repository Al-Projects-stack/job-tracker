services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: job-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: job-tracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: job-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-tracker-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

databases:
  - name: job-tracker-db
    plan: free
    databaseName: jobtracker
    user: jobtracker

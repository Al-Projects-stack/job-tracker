version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobtracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: jobtracker-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: jobtracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-to-a-long-random-secret-in-production-min-32-chars
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
